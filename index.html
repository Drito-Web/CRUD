<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>CRUD de Usuarios</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
  <main class="container">
    <div id="contenedorQR" class="modal">
      <div class="modal-contenido" id="qr-box"></div>
    </div>

   <div class="bannerInfo">
    <h1 class="title">Gestión de Usuarios</h1>
      <span class="eData"></span>
   </div>
    <form id="formUsuario">
      <input type="text" id="nombre" placeholder="Nombre" required />
      <input type="email" id="correo" placeholder="Correo" required />
      <input type="tel" id="telefono" placeholder="Teléfono" minlength="9" maxlength="9" required />
      <input type="text" id="cargo" placeholder="Cargo" required />
      <button type="submit">Guardar Usuario</button>
    </form>


    <h2>Lista de Usuarios</h2>
    <table id="tablaUsuarios">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Cargo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
